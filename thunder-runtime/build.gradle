plugins {
    alias libs.plugins.android.application
}

// 外置迅雷运行时包：只产独立 APK，不编进宿主。
// 包名必须与 RuntimeModule.THUNDER.getPackageName() 一致
// （com.fongmi.runtime.thunder），否则 verifyPackage 直接拒掉。
// 签名与宿主同钥：下面 signingConfigs.release 与 app/build.gradle 同款机制，
// 只读 local.properties（CI 由仓库机密写 local.properties，见 workflow 的 Setup signing），
// 不硬编码任何密码、不向任何人要 keystore；本地没有 local.properties 时与宿主一样
// 回落 debug 签名——那种包与正式宿主签名不一致，verifyPackage 会拒，
// 只能用于本地联调，不能当正式外置包发。
// 版本与各 flavor 的 assets/runtime.json 必须一致（versionCode 6 / versionName 1.1）：
// 位阶定在上游已发布的 5 / 1.0.4 之上——目录合并脚本拒降级，我方版本低于
// 基础目录里的上游条目就合不进去；往后我方每发一版在此基础上递增。
// RuntimeModule.verifyMetadata 逐项比对包信息与 runtime.json，差一项就拒。
// runtime.json 的摘要与大小由脚本 scripts/check_thunder_runtime_json.py
// 对 thunder/src/main/jniLibs 的 .so 实测重算，.so 换了必须重算重写，
// 否则宿主验包时 verifyPayloads 摘要对不上。
// .so 必须以 STORED（不压缩）留在 APK 里（RuntimeModule 的 "!/lib/<abi>/*.so"
// 直载与宿主 verifyPayloads 都要求 STORED）：靠下面 packaging.jniLibs
// useLegacyPackaging = false 保证——这正是上游 runtime 模块的口径；
// 置 true 时 AGP 会把库压缩进包（靠装机解压），宿主验包直接拒。
// 清单里显式写 extractNativeLibs 同样会被打包任务拒绝，不要往清单加。
// 打包路：buildSrc 的 PrepareRuntimeTask（上游原文）+ AbiApkPackaging
// 是生成／校验这份 runtime.json 的工具；当前 flavor 资产就是按它
// writeRuntimeMetadata 的字段口径生成的，见脚本。

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream {
        localProps.load(it)
    }
}
def hasReleaseSigning = localProps['storeFile'] && localProps['keyAlias'] && localProps['storePassword']
def releaseKeyPassword = localProps['keyPassword'] ?: localProps['storePassword']

android {
    namespace = 'com.fongmi.runtime.thunder'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId 'com.fongmi.runtime.thunder'
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 6
        versionName '1.1'
    }

    flavorDimensions = ['abi']

    productFlavors {
        arm64_v8a {
            dimension 'abi'
            ndk { abiFilters 'arm64-v8a' }
        }
        armeabi_v7a {
            dimension 'abi'
            ndk { abiFilters 'armeabi-v7a' }
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(localProps['storeFile'])
                keyAlias localProps['keyAlias']
                keyPassword releaseKeyPassword
                storePassword localProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
            keepDebugSymbols.add('**/*.so')
        }
    }
}

dependencies {
    // :thunder 的 Java 代码与 jniLibs 全进这个包；catvod 只作编译期接口
    // （ThunderRuntime 等走宿主类加载器，不在插件里另起一份语义——
    // PluginLoader 对非迅雷类一律走父加载器，插件 dex 里即使含 catvod 类也不会被用）。
    implementation project(':thunder')
    coreLibraryDesugaring libs.desugar
}
